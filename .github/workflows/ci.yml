name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # better-sqlite3 is a native module and is compiled here.
      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Build CLI
        run: npm run build:cli

      # The CLI is the tool's own contract: it must find the planted defects
      # and exit non-zero, and stay silent on a well-formed manifest.
      # A static page that ships without the shared stylesheet renders its
      # navigation as an unstyled list. That happened once; this catches it.
      - name: Static pages link the shared stylesheet
        run: |
          # Every static page, found rather than listed — the list was missing
          # the two most recently added, which is the failure this guards against.
          for f in $(find public -name '*.html'); do
            grep -q 'reading.css' "$f" || { echo "$f does not link /reading.css"; exit 1; }
            grep -q 'site-nav-brand' "$f" || { echo "$f has no site navigation"; exit 1; }
            grep -q 'theme.js' "$f" || { echo "$f has no theme control"; exit 1; }
          done
          echo "all $(find public -name '*.html' | wc -l) static pages link the stylesheet and carry navigation"

      - name: CLI finds planted defects and fails
        run: |
          if ./dist/cli.mjs fixtures/broken.m3u8 --quiet; then
            echo "CLI exited 0 on a manifest with known errors"; exit 1
          fi

      - name: CLI passes a well-formed manifest
        run: ./dist/cli.mjs fixtures/samples/multiperiod-dash/manifest.mpd --quiet

      # The README shows real CLI output. It has gone stale before — a test
      # count, a flag list, an "HLS only" that stopped being true — so the
      # figures it quotes are checked against what the commands actually print.
      - name: README's CLI examples still hold
        run: |
          set -e
          ./dist/cli.mjs fixtures/broken.m3u8 --markdown | grep -q "^# Ad signalling report"

          # The verdict the README quotes, from the command it quotes it from.
          verdict="FAIL  4 errors, 10 warnings, 3 info"
          ./dist/cli.mjs fixtures/broken.m3u8 --quiet | grep -qF "$verdict"
          grep -qF "$verdict" README.md

          fill="fill rate 40.0%  48s of 120s signalled across 4 avails"
          ./dist/cli.mjs compare fixtures/samples/ssai-source/playlist.m3u8 \
                                 fixtures/samples/ssai-output/playlist.m3u8 > cmp.txt || true
          grep -qF "$fill" cmp.txt
          grep -qF "$fill" README.md
          rm -f cmp.txt

          # Could-not-read must stay distinguishable from found-problems, or a
          # CDN timeout reads as a stream fault.
          code=0; ./dist/cli.mjs /nonexistent.m3u8 > /dev/null 2>&1 || code=$?
          test "$code" -eq 2 || { echo "unreadable input exited $code, expected 2"; exit 1; }
          code=0; ./dist/cli.mjs fixtures/broken.m3u8 --quiet > /dev/null 2>&1 || code=$?
          test "$code" -eq 1 || { echo "a manifest with errors exited $code, expected 1"; exit 1; }

          echo "the CLI examples in the README match what the CLI prints"

      # The segment fixtures are generated; regenerating them must reproduce
      # exactly what is committed, or the parsers and the generator have drifted.
      - name: Segment fixtures are reproducible
        run: |
          npx tsx scripts/make-segment-fixtures.ts
          npx tsx scripts/make-multiperiod-sample.ts
          git diff --exit-code -- fixtures/

      - name: CLI reports the SSAI comparison
        run: |
          if ./dist/cli.mjs compare \
            fixtures/samples/ssai-source/playlist.m3u8 \
            fixtures/samples/ssai-output/playlist.m3u8 --quiet; then
            echo "CLI exited 0 on a pipeline with unfilled avails"; exit 1
          fi
